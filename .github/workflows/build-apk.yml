name: Build TikChat APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Vet & test backend
        run: |
          cd backend
          go vet ./...
          go test ./...

      - name: Build backend (android/arm64)
        run: |
          cd backend
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X main.appVersion=v1.4.9" \
            -o ../android/app/src/main/assets/arm64-v8a/tikchat .
          ls -la ../android/app/src/main/assets/arm64-v8a/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tikchat-v1.4.9-apk
          path: android/app/build/outputs/apk/debug/*.apk
