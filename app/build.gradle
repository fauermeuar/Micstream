plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.taptap.micstream'
    compileSdk 34

    defaultConfig {
        applicationId 'com.taptap.micstream'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.0.1'

        // FFmpeg-kit membawa .so untuk tiap ABI; HP modern cukup arm64-v8a.
        // Tambahkan 'armeabi-v7a' kalau perlu mendukung HP 32-bit lama.
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }

    packagingOptions {
        // Kompres .so di dalam APK -> file APK lebih kecil (ukuran terpasang sedikit lebih besar).
        jniLibs { useLegacyPackaging = true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // FFmpeg (untuk publish srt:// ke OBS/VPS).
    // com.arthenica:ffmpeg-kit-* sudah dihapus dari Maven Central (retired April 2025),
    // jadi pakai fork terpelihara dengan API identik (package com.arthenica.ffmpegkit).
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:6.0.3'
}
